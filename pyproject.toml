[project]
name = "homelab-mcp"
version = "1.0.0"
description = "Read-only MCP server for querying homelab infrastructure (Proxmox, NetBox, systemd, and more)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "T. Philip", email = "57439211+t-philip@users.noreply.github.com" }]
keywords = ["mcp", "homelab", "proxmox", "netbox", "monitoring", "read-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2,<3",
    # `zoneinfo` needs a tz database; Windows and minimal containers lack one.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Every shipped adapter currently needs only the core deps (httpx / stdlib).
# The extras exist so the install surface is explicit and future adapters that
# pull heavier libraries have a home. `pip install homelab-mcp[all]` is the
# catch-all.
proxmox = []
netbox = []
systemd = []
grafana = []
influxdb = []
adguard = []
pinglog = []
http_json = []
all = [
    "homelab-mcp[proxmox,netbox,systemd,grafana,influxdb,adguard,pinglog,http_json]",
]

[project.scripts]
homelab-mcp = "homelab_mcp.cli:main"

[project.urls]
# Filled in when the repo is published. Kept out of the code for now.
Homepage = "https://example.invalid/homelab-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "ASYNC"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
